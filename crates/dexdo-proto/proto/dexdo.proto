syntax = "proto3";

package dexdo.v1;

// Seller->buyer channel. First a unary challenge (a nonce bound to the
// token_contract), then server-streaming of the provider response AFTER signature verification.
service Gateway {
  // Authorization step 1: the gateway issues a challenge -- a nonce bound to the token_contract.
  rpc GetChallenge(ChallengeRequest) returns (Challenge);

  // Step 2: the buyer signs the challenge with the note's private key (B18). The gateway verifies
  // the signature against the pubkey from the token_contract and streams the response ONLY on a match;
  // otherwise the connection is closed before forwarding (R16).
  rpc OpenStream(StreamRequest) returns (stream StreamFrame);
}

message ChallengeRequest {
  string token_contract = 1;
  // Query capabilities without issuing an authorization nonce. Absent = normal challenge.
  bool capabilities_only = 2;
}

message Challenge {
  // A nonce bound to the deal's token_contract: cannot be replayed on another session.
  bytes nonce = 1;
  string token_contract = 2;
  // Field numbers an older peer still reads; never reuse them.
  reserved 3, 4;
  // Consumer API paths this deal's upstream serves, e.g. "/v1/chat/completions".
  repeated string api_paths = 5;
}

message StreamRequest {
  string token_contract = 1;
  // The same nonce the gateway issued.
  bytes nonce = 2;
  // ed25519 signature (challenge_bytes) with the buyer's note private key.
  bytes signature = 3;
  // A field number an older peer still reads; never reuse it.
  reserved 4;
  // Maximum provider-native input + output tokens this request may bill.
  uint64 billing_grant_tokens = 5;
  // Opt in to concurrent requests drawing from one shared deal budget.
  bool shared_budget = 6;
  // Consumer API path the request arrived on, one of `Challenge.api_paths`.
  string path = 7;
  // The consumer's request body, byte for byte.
  bytes body = 8;
  // The consumer's request headers that may reach the provider.
  repeated Header headers = 9;
}

message Header {
  string name = 1;
  bytes value = 2;
}

// One step of the provider response. The first frame carries `head`; content frames carry `data`;
// a successful response ends with one `usage` frame.
message StreamFrame {
  // Provider HTTP status and response headers.
  ResponseHead head = 1;
  // Provider response bytes, unchanged.
  bytes data = 2;
  // Accepted billing for this request; present exactly once, last, on a successful response.
  BillingUsage usage = 3;
}

message ResponseHead {
  uint32 status = 1;
  repeated Header headers = 2;
}

// Provider-native terminal usage. `total_tokens` must be the checked sum of input + output.
message BillingUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3;
  // Accepted payment from the deal budget, separate from provider-native counts.
  // Absent means total_tokens.
  // Zero is valid even when the provider delivered a nonempty answer.
  optional uint64 charged_tokens = 4;
  // Cache counts are subsets of input_tokens, never additional billable tokens.
  uint64 cache_read_tokens = 5;
  uint64 cache_write_tokens = 6;
}
