[package]
name = "dexdo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305.workspace = true
# Handover: HKDF-SHA256 over the DH output -- a canonical ECIES-KDF instead of the raw
# x25519 secret as the AEAD key (security review O1). `sha2` is already in the graph (ed25519-dalek).
sha2.workspace = true
hkdf = "0.12"
rand.workspace = true
tokio = { workspace = true }
zeroize.workspace = true
# real chain backend on top of the gosh.ackinacki SDK. It used to be optional,
# behind a cargo feature; the features are gone and this builds unconditionally.
# Cross-platform (D6): the previous Windows blocker (tvm-sdk carried a test file with ':' in its path,
# which NTFS would not check out) is fixed upstream -- tvm-sdk, tag `v3.0.3-rc.an`. The pins point
# at clean upstream (fork removed, `[patch]` deleted), Windows/Linux/macOS build without workarounds.
anyhow = { workspace = true }
gosh-ackinacki = { git = "https://github.com/gosh-dot-ai/gosh.ackinacki", tag = "gosh-ackinacki-v0.4.1", default-features = false, features = ["private-note"] }
# Extracting the code-cell from.tvc to deploy InferenceOrderBook (the same logic as the SDK's
# `airegistry::abi::Contract::code_cell`). The workspace patch unifies this direct dependency
# with the version gosh.ackinacki pulls into the build graph transitively.
tvm_block = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an" }
tvm_types = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an" }
# Decoding the note's ext-out event bodies: the buyer reads the matched
# deal `tokenContract` from ITS OWN note's event - no shared-book index. The workspace patch unifies it
# with the tvm-sdk source gosh.ackinacki pulls transitively, so the single-SDK
# invariant (`ci/check_single_sdk.sh`) holds.
tvm_abi = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.4-rc.an" }
# Read-only salted-code identity checks use the SDK's canonical code-salt parser/rebuilder.
# The workspace patch keeps this direct dependency on the same TVM SDK revision as the rest.
tvm_client = { workspace = true }
base64 = { version = "0.22" }
# Explicit User-Agent for writes (`/v2/messages` behind Cloudflare): ChainClient uses the
# default reqwest UA (fine for getters), but submitting messages needs an explicit UA -- the edge
# 403s library defaults (see `DEXDO_USER_AGENT`) -- so the backend keeps its own http client.
# reqwest is already in the graph (via gosh.ackinacki).
reqwest = { workspace = true }

[dev-dependencies]
# Already vendored for the workspace (dev-dependency of `dexdo` and `dexdo-e2e`).
tempfile = "3"
# `test-util` only, and only here:'s regression drives the retry wrapper's own timeouts, and
# the property it holds -- that the measured clock skew does not grow with the number of retries --
# is only observable across a full retry budget. On the real clock that row would cost 45 seconds
# per run; on the paused one it costs nothing. `dexdo` already takes tokio this way for its tests.
tokio = { workspace = true, features = ["test-util"] }
anyhow.workspace = true
proptest.workspace = true
http.workspace = true
