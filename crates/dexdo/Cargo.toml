[package]
name = "dexdo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dexdo"
path = "src/main.rs"

[lib]
name = "dexdo"
path = "src/lib.rs"

# Run each global signal/panic-hook probe in its own process, with a real main-thread panic.
[dependencies]
opentelemetry = { version = "0.27", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["metrics", "grpc-tonic", "tls-roots"] }

dexdo-core = { path = "../core" }
dexdo-proto = { path = "../dexdo-proto" }
tokio.workspace = true
tonic.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio-stream.workspace = true
fs2 = "0.4"
rand.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
dexdo-wallet-onboarding = { path = "wallet-onboarding" }
# `svg` (PR1362): the opt-in `--qr-file` export of the same invitation QR.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# QR-as-image (terminal graphics): base64 feeds the kitty/iTerm2 escape payloads (already in the
# chain graph via dexdo-core), png encodes the iTerm2 inline image. Both stay out of the default
# (mock) build; the unicode fallback needs neither.
base64 = { version = "0.22" }
png = { version = "0.17" }
# Gosh.ai onboarding: the pasted Hot address + recovery phrase are read through ONE non-echoing
# terminal input. Neither std nor any crate already in this graph can disable terminal echo, and a
# hand-rolled termios/console toggle on a secret path is exactly the wrong place to be original --
# rpassword is the standard solution and restores the terminal on drop. Only the chain build has
# the interactive provider flow, so the dependency stays out of the default (mock) graph.
rpassword = { version = "7" }
# TLS channel, fingerprint pinning.
rcgen.workspace = true
sha2.workspace = true
tokio-rustls.workspace = true
hyper-util.workspace = true
tower.workspace = true
http.workspace = true
# G, B19/B20: local OpenAI/Anthropic-compatible consumer HTTP endpoint.
axum.workspace = true
async-stream.workspace = true
# real OpenAI-compatible upstream (Groq), streaming SSE.
reqwest.workspace = true
httpdate.workspace = true
# D6: default platform path for the endpoints file (config/data dir).
directories.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
hmac.workspace = true
k256.workspace = true
pbkdf2.workspace = true
tiny-bip39.workspace = true
zeroize.workspace = true
tvm_client = { workspace = true }
# The operating system's own secret store, where the operating system has one. Declared with no
# backend here on purpose: with no backend selected the crate resolves to its in-process mock, whose
# persistence is `EntryOnly`, and `secret_store` accepts a store only when it reports `UntilDelete`.
# So the base dependency buys one thing -- the same code compiles and is type-checked on every
# platform, including the Linux host that is the only one continuous integration builds -- while the
# per-target tables below are what actually turn a store on. Measured cost of the base dependency:
# one crate; its only dependency, `log`, is already in this graph.
keyring = { version = "3" }

# Keychain Services. `security-framework` is already in the macOS graph through
# reqwest -> rustls-platform-verifier, so `-framework Security` is already linked on this target and
# the backend adds no system library of its own.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Credential Manager. Its `windows-sys` is NOT the one declared below for the owner-only DACL: that
# one is `0.59`, keyring asks for `^0.60`, and pre-1.0 minors are semver-incompatible, so these
# are two separate copies that move independently -- raising ours does not carry keyring with it.
# The cost is still zero, for a different reason: `windows-sys 0.60.2` was already in the Windows
# graph through `tvm_client` -> `tvm_executor` -> `wasmtime v36.0.11` before keyring was added.
[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

# the POSIX existence probe (`kill(pid, 0)`) that corroborates an unlocked sentinel. Already
# in this build graph -- this only makes it callable from here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    # QR terminal-graphics probe: raw console mode + VT input for the DA1/kitty capability query.
    "Win32_System_Console",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic", "metrics"] }

# invariant property tests for routing/frame.
proptest.workspace = true
# qr_display's pure halves compile under `any(chain, test)` (the wallet_manual pattern), so the
# default-features test build needs the encoder crates the chain build used to get optionally.
base64 = "0.22"
png = "0.17"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# Reads the funding QR back out of the characters it was printed as, so the compatibility test
# against the wallet's own parser starts from the picture rather than from the string that built
# it. Decoder only, and only for tests: `image` support is off.
rqrr = { version = "0.10.1", default-features = false }
